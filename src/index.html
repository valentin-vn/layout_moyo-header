<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo Header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body>
    <h1>Moyo header</h1>
    <header class="header">
      <div class="logo">
        <a href="index.html">
          <img
            src="images/logo.png"
            alt="Moyo logo"
            class="nav_link"
          />
        </a>
      </div>
      <nav class="nav">
        <ul class="nav__lists">
          <li class="nav__list">
            <a
              href="index.html"
              class="nav_link is-active"
            >
              Apple
            </a>
          </li>
          <li class="nav__list">
            <a
              href="index.html"
              class="nav_link"
            >
              Samsung
            </a>
          </li>
          <li class="nav__list">
            <a
              href="index.html"
              class="nav_link"
            >
              Smartphones
            </a>
          </li>
          <li class="nav__list">
            <a
              href="index.html"
              class="nav_link"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav__list">
            <a
              href="index.html"
              class="nav_link"
            >
              Gadgets
            </a>
          </li>
          <li class="nav__list">
            <a
              href="index.html"
              class="nav_link"
            >
              Tablets
            </a>
          </li>
          <li class="nav__list">
            <a
              href="index.html"
              class="nav_link"
            >
              Photo
            </a>
          </li>
          <li class="nav__list">
            <a
              href="index.html"
              class="nav_link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
